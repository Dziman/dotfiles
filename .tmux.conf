# set zsh as default tmux shell
if-shell 'test -x /opt/homebrew/bin/zsh' 'set-option -g default-shell /opt/homebrew/bin/zsh' 'set-option -g default-shell /bin/zsh'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# increase scroll-back history
set -g history-limit 50000

set -gq utf8
set-window-option -gq utf8 on

set -g mouse on
set -sg escape-time 0

bind | split-window -h
bind - split-window -v

# Remap prefix to allow easy usage of emacs
set -g prefix C-z
unbind C-b
bind C-z send-prefix

bind r source-file ~/.tmux.conf \; display "Config refreshed."


# machine profile part, selected with `config-profile`
source-file -q ~/.dziman/profile/.tmux.conf
