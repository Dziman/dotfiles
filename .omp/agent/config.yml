  titleSpinner: braille
  hyperlinks: auto
  tight: true
display:
  shimmer: classic
  pinnedAgents: collapsed
  subagentLivePreview: true
  hideToolActivity: true
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: false
proseOnlyThinking: true
personality: pragmatic
startup:
  showSplash: true
contextPromotion:
  enabled: false
read:
  renderMarkdown: true
grep:
  enabled: true
astGrep:
  enabled: true
github:
  enabled: true
task:
  enableEffort: true
  enableLsp: true
  isolation:
    enabled: false
commands:
  enableClaudeUser: false
symbolPreset: nerd