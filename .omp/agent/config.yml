# Shared omp settings. Models, presets and machine services live in the profile
# overlay ~/.dziman/profile/.omp/agent/config.yml, passed with --config by the omp
# shell function.
symbolPreset: nerd
theme:
  dark: zenburn
setupVersion: 2
advisor:
  enabled: true
  reviewMode: agent-end
  reviewInterval: 1
  syncBacklog: strict
task:
  agentAdvisor:
    task: "on"
  enableEffort: true
  enableLsp: true
  isolation:
    enabled: false
retry:
  modelFallback: false
dev:
  autoqa: false
  autoqaConsent: denied
hideThinkingBlock: true
statusLine:
  contextLine: annotated
  preset: full
  separator: powerline
composer:
  shape: box
terminal:
  showProgress: true
tui:
  textSizing: false
  titleSpinner: braille
  hyperlinks: auto
  tight: true
display:
  shimmer: classic
  showTokenUsage: true
  showTurnTime: true
  pinnedAgents: collapsed
  subagentLivePreview: true
  hideToolActivity: true
  cacheMissMarker: false
personality: pragmatic
startup:
  showSplash: true
contextPromotion:
  enabled: false
read:
  renderMarkdown: true
grep:
  enabled: true
bash:
  enabled: true
astGrep:
  enabled: true
github:
  enabled: true
telemetry:
  otlpExportEnabled: false
enabledProviders:
  - claude
  - claude-plugins
skills:
  enableClaudeUser: true
commands:
  enableClaudeUser: true
