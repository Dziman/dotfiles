# ~/.omp/agent/models.yml
# Canonical equivalence overrides for the OpenRouter models used in modelRoles.
# Pinning the concrete `openrouter/<id>` selectors to their canonical ids keeps
# /models, transcripts, and canonical grouping stable across minor version
# bumps. Requires OPENROUTER_API_KEY in the env or stored auth.
providers:
  openrouter:
    # OpenRouter is a built-in provider; this override-only block makes the
    # config self-contained across machines. apiKey is an env-var NAME, so it
    # resolves from $OPENROUTER_API_KEY at runtime -- safe to commit.
    apiKey: OPENROUTER_API_KEY
    authHeader: true

equivalence:
  overrides:
    openrouter/z-ai/glm-5.2: glm-5.2
    openrouter/meta/muse-spark-1.1: muse-spark-1.1
    openrouter/moonshotai/kimi-k2.6: kimi-k2.6
    openrouter/moonshotai/kimi-k2.7-code: kimi-k2.7-code
    openrouter/deepseek/deepseek-v4-flash: deepseek-v4-flash
    openrouter/tencent/hy3-preview: hy3-preview
    openrouter/xiaomi/mimo-v2.5-pro: mimo-v2.5-pro
    openrouter/openai/gpt-5.4-mini: gpt-5.4-mini
    openrouter/openai/gpt-5.4-nano: gpt-5.4-nano
    openrouter/kwaipilot/kat-coder-pro-v2: kat-coder-pro-v2
    openrouter/kwaipilot/kat-coder-air-v2.5: kat-coder-air-v2.5
    openrouter/inclusionai/ling-2.6-flash: ling-2.6-flash
    openrouter/mistralai/mistral-nemo: mistral-nemo
